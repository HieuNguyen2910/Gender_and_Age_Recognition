<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Age & Gender Prediction – Image</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />

<style>
:root {
    --primary: #0d6efd;
    --primary-light: #3a8cff;
    --bg-light: #f4f6f9;
    --bg-dark: #121212;
    --card-light: #ffffff;
    --card-dark: #1e1e1e;
    --text-dark: #222;
    --text-light: #f5f5f5;
    --shadow: rgba(0,0,0,0.12);
}

body {
    font-family: "Segoe UI", sans-serif;
    background: var(--bg-light);
    transition: 0.3s ease-in-out;
    color: var(--text-dark);
}
body.dark-mode {
    background: var(--bg-dark);
    color: var(--text-light);
}

/* HEADER */
header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 30px;
    margin-bottom: 35px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: 16px;
    box-shadow: 0 6px 25px var(--shadow);
}
.header-logo {
    display: flex;
    align-items: center;
    gap: 12px;
}
.header-logo img {
    height: 45px;
    width: 45px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
}
nav a {
    color: white;
    margin-left: 0 !important;
    font-weight: 500;
    text-decoration: none;
    position: relative;
    transition: 0.3s;
}
nav a:hover {
    color: #ffdd57;
}
.theme-toggle {
    font-size: 1.4rem;
    cursor: pointer;
    color: white;
}

/* UPLOAD */
.upload-section {
    background: var(--card-light);
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 8px 25px var(--shadow);
    text-align: center;
    transition: 0.3s;
}
body.dark-mode .upload-section {
    background: var(--card-dark);
}
#drop-area {
    border: 2px dashed var(--primary);
    border-radius: 16px;
    padding: 50px;
    transition: 0.3s;
    cursor: pointer;
}
#drop-area:hover {
    background: rgba(13,110,253,0.08);
}
#drop-area.dragover {
    background: rgba(13,110,253,0.15);
}

/* DISPLAY */
.display-section {
    display: flex;
    gap: 35px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 35px;
}
.media-box {
    flex: 1 1 450px;
    max-width: 620px;
    padding: 25px;
    border-radius: 18px;
    background: var(--card-light);
    box-shadow: 0 10px 30px var(--shadow);
    display: flex;
    justify-content: center;
    align-items: center;
}
body.dark-mode .media-box {
    background: var(--card-dark);
}
.media-box img {
    max-width: 100%;
    border-radius: 16px;
    border: 3px solid var(--primary);
    box-shadow: 0 6px 25px rgba(0,0,0,0.2);
}

/* RESULT PANEL */
.result-panel {
    flex: 1 1 260px;
    max-width: 300px;
    background: var(--card-light);
    padding: 25px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 10px 30px var(--shadow);
}
body.dark-mode .result-panel {
    background: var(--card-dark);
}
.result-panel h4 {
    color: var(--primary);
    font-weight: 700;
    margin-bottom: 25px;
}
.gender-icons {
    display: flex;
    justify-content: center;
    gap: 45px;
    margin-bottom: 25px;
}
.gender-icon {
    font-size: 75px;
    opacity: 0.25;
    transition: 0.35s ease;
}
.active-gender {
    opacity: 1 !important;
    transform: scale(1.25);
}
.male-active {
    color: var(--primary);
    text-shadow: 0 0 20px rgba(13,110,253,0.6);
}
.female-active {
    color: #e83e8c;
    text-shadow: 0 0 20px rgba(232,62,140,0.6);
}
.age-box {
    font-size: 26px;
    font-weight: 700;
    padding: 18px 0;
    background: var(--card-light);
    border-radius: 14px;
    border: 2px solid #d0d0d0;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.07);
}
body.dark-mode .age-box {
    background: var(--card-dark);
    border-color: #555;
}
/* NAV MENU – phiên bản nổi bật có khung */
.nav-menu {
    display: flex;
    align-items: center;
    gap: 50px;
}

/* Link style */
.nav-menu a {
    color: white;
    padding: 10px 22px;
    border-radius: 12px;
    font-weight: 500;
    text-decoration: none;

    /* Hiệu ứng nổi + khung */
    border: 1px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(6px);

    transition: all 0.3s ease;
}

/* Hover neon */
.nav-menu a:hover {
    background: rgba(255, 255, 255, 0.22);
    border-color: rgba(255, 255, 255, 0.7);
    transform: translateY(-3px);
    box-shadow: 0 4px 12px rgba(255,255,255,0.35);
}

/* Active tab nổi hơn */
.nav-menu a.active {
    background: rgba(255, 255, 255, 0.35);
    border-color: rgba(255, 255, 255, 0.9);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 0 15px rgba(255,255,255,0.55);
    transform: translateY(-3px);
}

</style>
</head>
<body class="p-4">

<header>
    <div class="header-logo">
        <img src="https://cdn-icons-png.flaticon.com/512/4712/4712101.png" alt="Logo" />
        <span class="fs-4 fw-bold">Age & Gender AI</span>
    </div>
    <nav class="nav-menu">
        <a href="/" class="{% if request.path == '/' or request.path == '/image' %}active{% endif %}">Image</a>
        <a href="/video" class="{% if request.path == '/video' %}active{% endif %}">Video</a>
        <a href="/realtime" class="{% if request.path == '/realtime' %}active{% endif %}">Realtime</a>
    </nav>

    <div class="theme-toggle" id="theme-toggle">
        <i class="bi bi-moon-fill"></i>
    </div>
</header>

<div class="upload-section">
    <h2 class="mb-4 fw-bold">Upload ảnh để dự đoán</h2>

    <form method="POST" enctype="multipart/form-data" id="upload-form">
        {% csrf_token %}

        <div id="drop-area">
            <p class="mb-2">📁 Kéo thả ảnh vào đây hoặc click để chọn file</p>
            <input type="file" id="image-input" name="image" accept="image/*" style="display:none;" required />
        </div>

        <select class="form-select mt-3" name="model">
            <option value="mobilenetv2">MobileNetV2</option>
            <option value="resnet50">ResNet50</option>
        </select>

        <button class="btn btn-primary w-100 mt-3 py-2 fw-semibold">🚀 Xử lý ảnh</button>
    </form>

    {% if error %}
    <div class="alert alert-danger mt-3">{{ error }}</div>
    {% endif %}
</div>

<div class="display-section">
    <div class="media-box" id="media-box">
        {% if result %}
        <img src="{{ result }}" alt="Predicted Image" />
        {% endif %}
    </div>

    <div class="result-panel">
        <h4>Kết quả dự đoán</h4>

        <div class="gender-icons">
            <i id="icon-male" class="gender-icon bi bi-gender-male"></i>
            <i id="icon-female" class="gender-icon bi bi-gender-female"></i>
        </div>

        <div class="age-box">Age = <span id="age-value">0</span></div>
    </div>
</div>

<script>
/* ===================== DARK MODE ===================== */
document.getElementById("theme-toggle").onclick = () =>
    document.body.classList.toggle("dark-mode");


/* ===================== UPLOAD + PREVIEW ===================== */
const dropArea = document.getElementById("drop-area");
const input = document.getElementById("image-input");
const mediaBox = document.getElementById("media-box");

// Click để mở chọn file
dropArea.addEventListener("click", () => input.click());

// Chọn file
input.addEventListener("change", (e) => handleFiles(e.target.files));

// Ngăn browser mở ảnh
["dragenter", "dragover", "dragleave", "drop"].forEach(eventName => {
    dropArea.addEventListener(eventName, e => e.preventDefault());
});

// Drag UI
dropArea.addEventListener("dragover", () => dropArea.classList.add("dragover"));
dropArea.addEventListener("dragleave", () => dropArea.classList.remove("dragover"));

// Drop file
dropArea.addEventListener("drop", (e) => {
    dropArea.classList.remove("dragover");
    handleFiles(e.dataTransfer.files);
});

// Preview ảnh
function handleFiles(files) {
    if (!files || !files[0]) return;

    const file = files[0];
    input.files = files;

    if (!file.type.startsWith("image/")) {
        alert("Vui lòng chọn file hình ảnh!");
        return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
        mediaBox.innerHTML = `<img src="${e.target.result}" alt="Preview" />`;
    };
    reader.readAsDataURL(file);
}



/* ===================== NHẬN KẾT QUẢ TỪ DJANGO ===================== */
/* View trả ra:
   gender_text = "Male" hoặc "Female"
   age_val = số tuổi
*/

const gender = "{{ gender_text|default:'' }}";
const age = "{{ age_val|default:'' }}";

console.log("DEBUG gender =", gender);
console.log("DEBUG age =", age);

// Set tuổi
if (age !== "") {
    document.getElementById("age-value").innerText = age;
}

// Icons giới tính
const iconMale = document.getElementById("icon-male");
const iconFemale = document.getElementById("icon-female");

// So sánh đúng gender (viết hoa – đúng format AI trả ra)
if (gender === "Male") {
    iconMale.classList.add("active-gender", "male-active");
}
if (gender === "Female") {
    iconFemale.classList.add("active-gender", "female-active");
}

</script>
</body>
</html>
